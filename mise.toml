min_version = { soft = "2025.1.0" }

[tools]
git-cliff = "2.14.2"
gum = "0.17.0"
pre-commit = "4.7.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[env]
_.file = ".env"

[tasks.install]
description = "Install tools and initialize git hooks [i]"
alias = "i"
run = [
  "mise install",
  "pre-commit install --install-hooks"
]

[tasks.check]
description = "Run repository checks via pre-commit"
run = "pre-commit run --all-files"
sources = [".pre-commit-config.yaml"]

[tasks.validate]
description = "Validate rendered files: Jinja delimiters, answers file, then pre-commit checks"
run = [
  "bash scripts/validate-render.sh",
  "mise run check"
]

[tasks.format]
description = "Format shell scripts with shfmt"
run = "shfmt --list --write ."

[tasks.changelog]
description = "Generate changelog with git-cliff"
run = "git-cliff --output CHANGELOG.md"
outputs = ["CHANGELOG.md"]

[tasks.bump]
description = "Bump pinned tools in mise.toml to latest stable fixed versions"
run = "bash scripts/bump-mise-tools.sh"
# Forward all args (including --help) to the script untouched.
raw_args = true
